<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booker</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#007bff">
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f7f6; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; width: 100%; max-width: 300px; font-weight: bold; }
        #debug-console { background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 12px; padding: 15px; margin-top: 20px; text-align: left; border-radius: 8px; min-height: 150px; }
    </style>
</head>
<body>

    <h2>Magpas Room Booker</h2>
    <button id="enable-notifications-btn" class="btn">Enable Push Notifications</button>

    <div id="debug-console">> Console Initialized. Checking PWA status...</div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('debug-console').innerHTML += `<div style="color:red;">LOAD ERROR: ${message} at line ${lineno}</div>`;
            return false;
        };

        const debugBtn = document.getElementById('enable-notifications-btn');
        const debugConsole = document.getElementById('debug-console');

        function log(msg, color = '#00ff00') {
            debugConsole.innerHTML += `<div style="color:${color};">> ${msg}</div>`;
        }

        // Catch the native installation prompt if the browser offers it
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            log('SUCCESS: Browser recognized PWA! Install prompt is ready.', '#51cf66');
        });

        window.addEventListener('DOMContentLoaded', async () => {
            log('Script loaded. Registering Service Worker...');
            try {
                const reg = await navigator.serviceWorker.register('./sw.js');
                log(`Service Worker Registered! Scope: ${reg.scope}`, '#ffff00');
            } catch (err) {
                log(`SW REGISTRATION FAILED: ${err.message}`, 'red');
            }
        });

        debugBtn.addEventListener('click', async () => {
            log('Button clicked. Requesting notification permission...');
            try {
                const perm = await Notification.requestPermission();
                log(`Permission outcome: ${perm}`, perm === 'granted' ? '#00ff00' : 'red');
                
                if (perm === 'granted' && deferredPrompt) {
                    log('Triggering app installation prompt...');
                    deferredPrompt.prompt();
                }
            } catch (err) {
                log(`CRASH: ${err.message}`, 'red');
            }
        });
    </script>
</body>
</html>
