<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Booker</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; background: #f4f7f6; }
        .btn { background: #007bff; color: white; border: none; padding: 15px 30px; font-size: 16px; border-radius: 8px; width: 100%; max-width: 300px; }
        #debug-console { background: #1e1e1e; color: #00ff00; font-family: monospace; font-size: 12px; padding: 15px; margin-top: 20px; text-align: left; border-radius: 8px; min-height: 150px; }
    </style>
</head>
<body>

    <h2>Magpas Room Booker</h2>
    <button id="enable-notifications-btn" class="btn">Enable Push Notifications</button>

    <div id="debug-console">> Console Initialized. Tap button...</div>

    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            document.getElementById('debug-console').innerHTML += `<div style="color:red;">LOAD ERROR: ${message} at line ${lineno}</div>`;
            return false;
        };

        const debugBtn = document.getElementById('enable-notifications-btn');
        const debugConsole = document.getElementById('debug-console');

        function log(msg, color = '#00ff00') {
            debugConsole.innerHTML += `<div style="color:${color};">> ${msg}</div>`;
        }

        log('Script successfully loaded and parsed.', '#ffff00');

        debugBtn.addEventListener('click', async () => {
            log('CLICK DETECTED!', '#ffffff');
            
            try {
                log('Checking core browser APIs...');
                if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
                    log('Error: Browser lacks Service Worker or Push support.', 'red');
                    return;
                }
                
                // FIX: Register the Service Worker FIRST. 
                // Chrome on Android often requires an active SW context before showing the prompt.
                log('Step 1: Registering sw.js...');
                const reg = await navigator.serviceWorker.register('./sw.js');
                log(`SW Context Active! Scope: ${reg.scope}`, '#ffff00');
                
                // Step 2: Request permission inside the active registration context
                log('Step 2: Requesting notification permission...');
                const perm = await Notification.requestPermission();
                log(`Result from browser: ${perm}`, perm === 'granted' ? '#00ff00' : 'red');
                
                if (perm === 'granted') {
                    log('SUCCESS! Notifications allowed.', '#00ff00');
                }
            } catch (err) {
                log(`CRASH: ${err.name} - ${err.message}`, 'red');
                console.error(err);
            }
        });
    </script>
</body>
</html>
